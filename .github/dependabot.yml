version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # init and analyze must always move together: mixed major versions break the CodeQL workflow.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest aiohttp
          pip install -r tools/requirements-ble.txt

      - name: Run Ruff Linter
        run: |
          ruff check custom_components/ tools/ tests/

      - name: Run Black Code Formatter Check
        run: |
          black --check custom_components/ tools/ tests/

      - name: Run Unit Tests
        # Live tests against the real WELOCK cloud never run in CI.
        env:
          WELOCK_LIVE_TEST: "0"
        run: |
          pytest -m "not live"

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest aiohttp
          pip install -r tools/requirements-ble.txt

      - name: Run Ruff Linter
        run: |
          ruff check custom_components/ tools/ tests/ tests_ha/

      - name: Run Black Code Formatter Check
        run: |
          black --check custom_components/ tools/ tests/ tests_ha/

      - name: Run Unit Tests
        # Live tests against the real WELOCK cloud never run in CI.
        env:
          WELOCK_LIVE_TEST: "0"
        run: |
          pytest -m "not live"

  ha-tests:
    # The integration running inside a real Home Assistant core (pytest-homeassistant-custom-component).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install Home Assistant test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component
          pip install bleak bleak-retry-connector

      - name: Run Home Assistant tests
        run: |
          pytest -c tests_ha/pytest.ini tests_ha --cov=custom_components/welock --cov-report=term-missing

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest aiohttp
          pip install -r tools/requirements-ble.txt

      - name: Run Ruff Linter
        run: |
          ruff check custom_components/ tools/ tests/ tests_ha/

      - name: Complexity (xenon)
        run: |
          pip install xenon
          xenon --max-absolute B --max-modules A --max-average A custom_components

      - name: Run Black Code Formatter Check
        run: |
          black --check custom_components/ tools/ tests/ tests_ha/

      - name: Run Unit Tests
        # Live tests against the real WELOCK cloud never run in CI.
        env:
          WELOCK_LIVE_TEST: "0"
        run: |
          pytest -m "not live"

  ha-tests:
    # The integration running inside a real Home Assistant core (pytest-homeassistant-custom-component).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install Home Assistant test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install bleak bleak-retry-connector

      - name: Run Home Assistant tests
        run: |
          pytest -c tests_ha/pytest.ini tests_ha --cov=custom_components/welock
          pytest tests -o asyncio_mode=auto -p no:cacheprovider --cov=custom_components/welock --cov-append --cov-report=term-missing --cov-fail-under=95

      - name: Type check (mypy, with the real Home Assistant types)
        run: |
          pip install mypy
          mypy custom_components/welock

fetch_access_log:
  name: Fetch access log
  description: >-
    Fetch the lock's access log (who opened it, when and how) from the WeLock
    cloud and store it on the "Last access" sensor. This logs in to the cloud
    and therefore ends other sessions of the account (for example the WeLock
    app on your phone), so use it only when you need it.
  fields:
    page_size:
      name: Number of entries
      description: How many of the most recent access-log entries to fetch.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: box

import_commands:
  name: Import command table
  description: >-
    Add unlock commands from a JSON table file to the local command cache of the
    lock the file belongs to (matched by its device number). Existing commands
    are never overwritten; differing ones are reported as conflicts. This does
    not switch offline unlocking on. The table is security-sensitive: keep the
    file private.
  fields:
    path:
      name: File
      description: >-
        Path of the table file, relative to the Home Assistant configuration
        folder.
      default: welock-oracle-table.json
      example: welock-oracle-table.json
      selector:
        text:
